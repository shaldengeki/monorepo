syntax = "proto3";

package games.checkers.proto;

option go_package = "github.com/shaldengeki/monorepo/games/checkers/proto";

import "games/checkers/proto/board.proto";
import "games/checkers/proto/player.proto";
import "games/checkers/proto/score.proto";

message GameState {
    // Reflects the state of a game at a given moment in time.
    // Players change this state by taking valid actions.

    uint32 turn = 1;
    uint32 round = 2;
    bool finished = 3;
    repeated Score scores = 4;
    Board board = 5;
    repeated Player players = 6;
}

syntax = "proto3";

package games.checkers.proto.server;

import "games/checkers/proto/board_marker.proto";
import "games/checkers/proto/game_state.proto";

option go_package = "github.com/shaldengeki/monorepo/games/checkers/proto/server";

message CreateGameRequest {
}

message CreateGameResponse {
    string game_id = 1;
}

message GetStateRequest {
    string game_id = 1;
}

message GetStateResponse {
    checkers.proto.GameState game_state = 1;
}

message ValidateStateRequest {
    checkers.proto.GameState game_state = 1;
}

message ValidateStateResponse {
    repeated string validation_errors = 1;
}

message MakeMoveRequest {
    string game_id = 1;
    checkers.proto.BoardMarker move = 2;
}

message MakeMoveResponse {
    checkers.proto.GameState game_state = 1;
    repeated string validation_errors = 2;
}

service GameService {
    rpc CreateGame(CreateGameRequest) returns (CreateGameResponse);
    rpc GetState(GetStateRequest) returns (GetStateResponse);
    rpc ValidateState(ValidateStateRequest) returns (ValidateStateResponse);
    rpc MakeMove(MakeMoveRequest) returns (MakeMoveResponse);
}
